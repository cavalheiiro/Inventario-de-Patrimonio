<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventário de Patrimônio - FZEA</title>
  <style>
    * { 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    body { 
      margin: 0; 
      padding: 15px; 
      background: #f4f6f8; 
      color: #333; 
    }
    h1, h3 { 
      margin-top: 0; 
    }
    .card { 
      background: white; 
      border-radius: 10px; 
      padding: 15px; 
      margin-bottom: 15px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.08); 
    }
    input, select, button { 
      width: 100%; 
      padding: 12px; 
      margin-top: 8px; 
      border-radius: 6px; 
      border: 1px solid #ccc; 
      font-size: 16px; 
    }
    button { 
      background: #0066cc; 
      color: white; 
      font-weight: bold; 
      border: none; 
      cursor: pointer; 
    }
    button:active { 
      background: #004bb3; 
    }
    .btn-secondary {
      background: #6c757d;
      margin-top: 5px;
    }
    .btn-next {
      background: #28a745;
      font-size: 18px;
      padding: 15px;
      margin-top: 12px;
      display: none;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }
    #interactive { 
      width: 100%; 
      max-width: 500px; 
      margin: 10px auto 0 auto; 
      overflow: hidden; 
      border-radius: 8px; 
    }
    .status-ok { 
      background: #d4edda; 
      color: #155724; 
      border-left: 5px solid #28a745; 
    }
    .status-warning { 
      background: #fff3cd; 
      color: #856404; 
      border-left: 5px solid #ffc107; 
    }
    .status-danger { 
      background: #f8d7da; 
      color: #721c24; 
      border-left: 5px solid #dc3545; 
    }
    .result-box { 
      padding: 12px; 
      margin-top: 10px; 
      border-radius: 6px; 
    }
    .history-item { 
      display: flex; 
      justify-content: space-between; 
      padding: 8px 0; 
      border-bottom: 1px solid #eee; 
      font-size: 14px; 
    }
    .badge-info {
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 4px;
      background: #d1ecf1;
      color: #0c5460;
      display: inline-block;
      margin-top: 5px;
    }
  </style>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

  <h1>🏢 Inventário de Patrimônio</h1>

  <!-- Passo 1: Arquivo e Localização -->
  <div class="card">
    <h3>📋 1. Base de Patrimônio e Sala Atual</h3>
    <div class="badge-info">⚡ Locais FZEA pré-carregados na memória.</div>
    
    <label style="margin-top: 15px; display: block;"><strong>Importar Planilha de Patrimônio (CSV):</strong></label>
    <input type="file" id="csvFileInput" accept=".csv">
    
    <label style="margin-top: 15px; display: block;"><strong>Selecione a Sala Atual:</strong></label>
    <select id="roomSelect" onchange="syncRoomInput(this.value)">
      <option value="">-- Carregue o CSV de Patrimônio primeiro --</option>
    </select>
    <input type="text" id="currentRoom" placeholder="Código ou Nome da Sala Atual">
  </div>

  <!-- Passo 2: Digitalização -->
  <div class="card">
    <h3>📷 2. Leitura de Código de Barras</h3>
    <button id="btnStartScan" onclick="toggleScanner()">📷 Ligar Câmera / Escanear</button>
    <button id="btnTorch" class="btn-secondary" onclick="toggleTorch()" style="display: none;">🔦 Ligar Flash</button>
    
    <div id="interactive"></div>
    
    <!-- Botão de Próximo Scan -->
    <button id="btnNextScan" class="btn-next" onclick="triggerNextScan()">▶️ Escanear Próximo</button>
    
    <div id="scanResult"></div>
  </div>

  <!-- Passo 3: Estado e Exportação -->
  <div class="card">
    <h3>📊 3. Estado do Inventário</h3>
    <p>Total na Base: <strong id="totalCount">0</strong> | Auditados: <strong id="auditedCount">0</strong></p>
    
    <button onclick="exportCSV()" style="background: #28a745;">📥 Baixar CSV Atualizado</button>
    
    <h4 style="margin-top: 20px;">Últimas Leituras:</h4>
    <div id="historyList"></div>
  </div>

  <script>
    // --- DICIONÁRIO DE SALAS FZEA PRÉ-CARREGADO ---
    const LOCAIS_PRECARREGADOS = {"12385": "12385 - FCHE06 04/DIRETORIA/DIRETOR (TÉRREO)", "12387": "12387 - FCHE06 44/DIRET/ASS.DIREÇÃO (TÉRREO)", "12389": "12389 - FCHE06 11/ATADM/ASSIST. (TÉRREO)", "12390": "12390 - FCHE06 10/DIRET/CONGREGAÇÃO (TÉRREO)", "12392": "12392 - FCHE06 03/DIRETORIA/SECRET. (TÉRREO)", "12393": "12393 - FCHE06 42/ATFIN/ASSISTENTE (TÉRREO)", "12394": "12394 - FCHE06 38/CONTAB/TESOURARIA (TÉRREO)", "12400": "12400 - FCHE06 36/ATFIN/ALMOX (TÉRREO)", "12404": "12404 - PDHE24 21/ATADM/VEÍCULOS (TERREO)", "12405": "12405 - FCHE06 39/ATADM/SÇ EXPEDIEN (TÉRREO)", "12406": "12406 - FCHE06 02/ATACAD/ASSIST. (TÉRREO)", "12408": "12408 - FCHE06 13/BIBLIO/BIBLIOTECA (TÉRREO)", "12415": "12415 - PDHE24 19/ATADM/SÇ MANUT. (TERREO)", "12416": "12416 - PDHE24 16/ATADM/OF.MANUTEN (TERREO)", "12423": "12423 - FCHE06 20/SÇ TI/SUPORTE TI (TÉRREO)", "12424": "12424 - FCHE06 22/SÇ TI/SALA REDES (TÉRREO)", "12427": "12427 - FCHE06 29/GRAD/COORDENAÇÃO (TÉRREO)", "12431": "12431 - FCHE06 05/POSGRAD/SECRET. (TÉRREO)", "12432": "12432 - FCHE06 34/PESQ/SECRETARIA (TÉRREO)", "12433": "12433 - FCHE06 35/CULTEXT/SECRET. (TÉRREO)", "12435": "12435 - FCHE06 30/GRAD/SALA ATEND. (TÉRREO)", "12439": "12439 - FCHE06 08/RECDOC/ARQUIVO (TÉRREO)", "12440": "12440 - FCHE06 12/ATADM/SÇ COMPRAS (TÉRREO)", "12441": "12441 - FCHE06 43/ATFIN/SÇ FINANÇAS (TÉRREO)", "12443": "12443 - FCHE06 41/ATADM/SÇ PESSOAL (TÉRREO)", "12445": "12445 - FCHE06 24/BIBLIO/MUSEU (TÉRREO)", "12448": "12448 - FCHE06 18/BIBLIO/CIRCULAÇÃO (TÉRREO)", "12453": "12453 - FCHE06 16/BIBLIO/ACERVO (TÉRREO)", "12454": "12454 - FCHE06 26/SALA ESTUDO GRUPO (TÉRREO)", "12457": "12457 - FCHE06 15/BIBLIO/MULTIMÍDIA (TÉRREO)", "12461": "12461 - FCHE06 23/BIBLIO/RESTAURO (TÉRREO)", "12463": "12463 - FCHE06 07/RECDOC/PROTOCOLO (TÉRREO)", "12465": "12465 - PDHE24 23/RESTAURANTE/COZIN (TERREO)", "12466": "12466 - PDHE24 24/RESTAUR/REFEITÓR (TERREO)", "12467": "12467 - PDHE24 25/REST/SALA ATEND. (TERREO)", "12468": "12468 - PDHE24 02/SÇ MED/ENFERMARIA (TERREO)", "12469": "12469 - PDHE24 03/SÇ MED/ODONTOL. (TERREO)", "12470": "12470 - PDHE24 01/SÇ MED/RECEPÇÃO (TERREO)", "12471": "12471 - PDHE24 13/UBAS/SALA REUNIÃO (TERREO)", "12472": "12472 - PDHE24 14/UBAS/SERVIÇO SOC. (TERREO)", "12473": "12473 - PDHE24 15/UBAS/PSICOLOGIA (TERREO)", "12474": "12474 - ZTL01 02/LAB/BOMBEAMENTO (TERREO)", "12475": "12475 - ZTL01 01/CENTRAL/GLP (TERREO)", "12478": "12478 - FCHE06 14/BIBLIO/PROCESSAM. (TÉRREO)", "12479": "12479 - FCHE06 17/BIBLIO/CHEFIA (TÉRREO)", "12480": "12480 - FCHE06 06/RECDOC/ARQUIVO (TÉRREO)", "12481": "12481 - FCHE06 37/ATFIN/ALMOX/DEP (TÉRREO)", "12482": "12482 - FCHE06 21/SÇ TI/DEP.TI (TÉRREO)", "12483": "12483 - FCHE06 09/RECDOC/DEPÓSITO (TÉRREO)", "12484": "12484 - PDHE24 17/ATADM/DEP.MANUT. (TERREO)", "12485": "12485 - PDHE24 18/ATADM/DEP.MANUT. (TERREO)", "12486": "12486 - PDHE24 20/ATADM/SALA FERRAM (TERREO)", "12487": "12487 - PDHE24 22/ATADM/VESTIÁRIO (TERREO)", "12488": "12488 - PDHE24 26/REST/ESTOQUE ALIM (TERREO)", "12489": "12489 - PDHE24 27/REST/CAMARA FRIG (TERREO)", "12490": "12490 - PDHE24 28/REST/CAMARA FRIG (TERREO)", "12491": "12491 - PDHE24 29/REST/DEP.LIMPEZA (TERREO)", "12492": "12492 - PDHE24 30/REST/VESTIÁRIO (TERREO)", "12493": "12493 - PDHE24 04/UBAS/SALA ATEND. (TERREO)", "12494": "12494 - PDHE24 05/UBAS/EXPEDIENTE (TERREO)", "12495": "12495 - PDHE24 06/UBAS/EXPEDIENTE (TERREO)", "12496": "12496 - PDHE24 07/UBAS/SALA ATEND. (TERREO)", "12497": "12497 - PDHE24 08/UBAS/COPINHA (TERREO)", "12498": "12498 - PDHE24 09/UBAS/SALA REUNIÃO (TERREO)", "12499": "12499 - PDHE24 10/UBAS/RECEPÇÃO (TERREO)", "12500": "12500 - PDHE24 11/UBAS/SALA VACINA (TERREO)", "12501": "12501 - PDHE24 12/UBAS/DEPÓSITO (TERREO)", "12503": "12503 - FCHE06 28/SALA ESTUDO INDIV (TÉRREO)", "12504": "12504 - FCHE06 27/SALA ESTUDO INDIV (TÉRREO)", "12505": "12505 - FCHE06 25/SALA ESTUDO GRUPO (TÉRREO)", "12506": "12506 - FCHE06 31/SALA REUNIÃO (TÉRREO)", "12507": "12507 - FCHE06 32/SALA REUNIÃO (TÉRREO)", "12508": "12508 - FCHE06 33/SALA ATENDIMENTO (TÉRREO)", "12509": "12509 - FCHE06 40/ATADM/CHEFIA (TÉRREO)", "12510": "12510 - FCHE06 01/ATACAD/CHEFIA (TÉRREO)", "12511": "12511 - FCHE06 19/SÇ TI/CHEFIA TI (TÉRREO)", "12512": "12512 - ZTL01 03/SUBESTAÇÃO 01 (TERREO)", "12513": "12513 - ZTL01 04/SUBESTAÇÃO 02 (TERREO)", "12514": "12514 - ZTL01 05/SUBESTAÇÃO 03 (TERREO)", "12515": "12515 - ZTL01 06/PORTARIA 01 (TERREO)", "12516": "12516 - ZTL01 07/PORTARIA 02 (TERREO)", "12517": "12517 - ZTL01 08/CENTRAL/SEGURANÇ (TERREO)", "12518": "12518 - ZTL01 09/SALA RESÍDUOS (TERREO)", "12519": "12519 - ZTL01 10/ESTAÇÃO/TRAT.AGUA (TERREO)", "12520": "12520 - ZTL01 11/ESTAÇÃO/TRAT.ESG. (TERREO)"};

    let rawHeaders = [];
    let database = [];
    let mepLocaisNorm = {};
    let html5QrcodeScanner = null;
    let isScanning = false;
    let isTorchOn = false;
    let isPaused = false;

    // CANAL GLOBAL DE ÁUDIO
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Normalizador de códigos
    function normalizeCode(code) {
      if (code === null || code === undefined) return '';
      let str = code.toString().trim();
      str = str.replace(/^\uFEFF/, '').replace(/[\x00-\x1F\x7F-\x9F]/g, '');
      str = str.replace(/\.0+$/, '');
      str = str.replace(/[^a-zA-Z0-9]/g, '');
      str = str.replace(/^0+/, '');
      return str.toUpperCase();
    }

    window.addEventListener('DOMContentLoaded', () => {
      mepLocaisNorm = {};
      for (let key in LOCAIS_PRECARREGADOS) {
        mepLocaisNorm[normalizeCode(key)] = LOCAIS_PRECARREGADOS[key];
      }
    });

    function obterNomeSala(codigoSala) {
      if (!codigoSala) return '';
      const norm = normalizeCode(codigoSala);
      return mepLocaisNorm[norm] || codigoSala;
    }

    // --- SINAIS SONOROS ---
    function playScanBeep() {
      try {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 1200;
        gain.gain.value = 0.2;
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.08);
      } catch(e){}
    }

    function playStatusBeep(type) {
      try {
        initAudio();
        if (!audioCtx) return;
        const gain = audioCtx.createGain();
        gain.connect(audioCtx.destination);

        if (type === 'ok') {
          const osc1 = audioCtx.createOscillator();
          const osc2 = audioCtx.createOscillator();
          osc1.connect(gain); osc2.connect(gain);
          osc1.frequency.value = 800; osc2.frequency.value = 1200;
          gain.gain.value = 0.2;
          osc1.start(audioCtx.currentTime); osc1.stop(audioCtx.currentTime + 0.1);
          osc2.start(audioCtx.currentTime + 0.1); osc2.stop(audioCtx.currentTime + 0.25);
        } else if (type === 'warning') {
          const osc = audioCtx.createOscillator();
          osc.connect(gain);
          osc.frequency.value = 500;
          gain.gain.value = 0.25;
          osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'danger') {
          const osc = audioCtx.createOscillator();
          osc.connect(gain);
          osc.frequency.value = 220;
          gain.gain.value = 0.3;
          osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.4);
        }
      } catch(e){}
    }

    // --- PROCESSAMENTO DO CSV DE PATRIMÔNIO ---
    document.getElementById('csvFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        parseCSVPatrimonio(evt.target.result);
      };
      reader.readAsText(file, 'UTF-8');
    });

    function parseCSVPatrimonio(text) {
      text = text.replace(/^\uFEFF/, '');
      const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
      if (lines.length === 0) return;

      const delimiter = text.includes(';') ? ';' : ',';

      function splitRow(rowStr) {
        const regex = new RegExp(`(?:^|${delimiter})(?:"([^"]*)"|([^"${delimiter}]*))`, 'g');
        const matches = [];
        let match;
        while ((match = regex.exec(rowStr)) !== null) {
          let val = match[1] !== undefined ? match[1] : match[2];
          matches.push(val ? val.trim() : '');
        }
        return matches;
      }

      rawHeaders = splitRow(lines[0]);
      database = [];
      const roomSet = new Set();

      let patrimonioColIdx = 0;
      let enderecoColIdx = 2;
      let respColIdx = 9;
      let situacaoColIdx = 10;

      // Mapeamento dinâmico de colunas
      rawHeaders.forEach((h, idx) => {
        const headerNorm = h.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        if (headerNorm.includes("patrimonio") || headerNorm.includes("tombo") || headerNorm.includes("codigo")) {
          patrimonioColIdx = idx;
        }
        if (headerNorm.includes("endereco") || headerNorm.includes("local") || headerNorm.includes("sala")) {
          enderecoColIdx = idx;
        }
        if (headerNorm.includes("resp") || headerNorm.includes("pessoa") || headerNorm.includes("nome") || headerNorm.includes("usuario") || headerNorm.includes("detentor")) {
          respColIdx = idx;
        }
        if (headerNorm.includes("situacao") || headerNorm.includes("status")) {
          situacaoColIdx = idx;
        }
      });

      for (let i = 1; i < lines.length; i++) {
        const cols = splitRow(lines[i]);
        if (cols.length > 0) {
          const enderecoRaw = cols[enderecoColIdx] || '';
          const item = {
            patrimonio: cols[patrimonioColIdx] || cols[0] || '',
            unidade: cols[1] || '', 
            centroGerencial: enderecoRaw,
            material: cols[3] || '', 
            marca: cols[4] || '', 
            modelo: cols[5] || '',
            tipo: cols[6] || '', 
            noSerie: cols[7] || '', 
            valor: cols[8] || '',
            resp: cols[respColIdx] || '', 
            situacao: cols[situacaoColIdx] || '', 
            condicao: cols[11] || '',
            inventario: cols[12] || 'Pendente', 
            retirado: cols[13] || '',
            localEncontrado: cols[14] || '', 
            dataLeitura: cols[15] || ''
          };
          database.push(item);
          if (enderecoRaw) roomSet.add(enderecoRaw);
        }
      }

      const select = document.getElementById('roomSelect');
      select.innerHTML = '<option value="">-- Selecione a sala atual --</option>';
      
      Array.from(roomSet).sort().forEach(roomCode => {
        const opt = document.createElement('option');
        opt.value = roomCode;
        opt.innerText = obterNomeSala(roomCode);
        select.appendChild(opt);
      });

      updateCounters();
      document.getElementById('scanResult').innerHTML = `<div class="result-box status-ok">✅ Planilha carregada: ${database.length} itens.</div>`;
    }

    function syncRoomInput(val) {
      if (val) document.getElementById('currentRoom').value = val;
    }

    // --- CONTROLE DA CÂMERA E FLASH ---
    function toggleScanner() {
      initAudio();
      const btn = document.getElementById('btnStartScan');
      if (isScanning) {
        stopScanner();
        btn.innerText = "📷 Ligar Câmera / Escanear";
        document.getElementById('btnTorch').style.display = 'none';
        document.getElementById('btnNextScan').style.display = 'none';
        isScanning = false;
        isPaused = false;
      } else {
        startScanner();
        btn.innerText = "🛑 Parar Câmera";
        isScanning = true;
      }
    }

    function startScanner() {
      const formatsToSupport = [
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.ITF,
        Html5QrcodeSupportedFormats.UPC_A
      ];

      html5QrcodeScanner = new Html5Qrcode("interactive", { formatsToSupport: formatsToSupport, verbose: false });

      const config = {
        fps: 25,
        qrbox: { width: 320, height: 100 },
        videoConstraints: {
          facingMode: "environment",
          width: { min: 1280, ideal: 1920 },
          height: { min: 720, ideal: 1080 }
        },
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
      };

      html5QrcodeScanner.start(
        { facingMode: "environment" },
        config,
        onBarcodeScanned
      ).then(() => {
        document.getElementById('btnTorch').style.display = 'block';
        document.getElementById('btnNextScan').style.display = 'none';
        isPaused = false;
      }).catch(err => {
        document.getElementById('scanResult').innerHTML = `<div class="result-box status-danger">Erro de Câmera: ${err}</div>`;
      });
    }

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById('interactive').innerHTML = '';
          isTorchOn = false;
          document.getElementById('btnTorch').innerText = "🔦 Ligar Flash";
          document.getElementById('btnNextScan').style.display = 'none';
        }).catch(() => {});
      }
    }

    async function toggleTorch() {
      if (!html5QrcodeScanner || !isScanning) return;
      try {
        const track = html5QrcodeScanner.getRunningTrack();
        if (track && track.getCapabilities().torch) {
          isTorchOn = !isTorchOn;
          await track.applyConstraints({ advanced: [{ torch: isTorchOn }] });
          document.getElementById('btnTorch').innerText = isTorchOn ? "💡 Desligar Flash" : "🔦 Ligar Flash";
        } else {
          alert("O flash não é suportado por este navegador.");
        }
      } catch (e) {
        alert("Erro no flash: " + e.message);
      }
    }

    // --- LEITURA E PROCESSAMENTO ---
    function onBarcodeScanned(decodedText) {
      if (isPaused) return;

      const currentRoomInput = document.getElementById('currentRoom').value.trim();

      if (!currentRoomInput) {
        playStatusBeep('danger');
        document.getElementById('scanResult').innerHTML = `<div class="result-box status-danger">⚠️ Selecione a Sala Atual antes de escanear!</div>`;
        return;
      }

      // PAUSA IMEDIATA DA CÂMERA
      isPaused = true;
      try {
        html5QrcodeScanner.pause(true);
      } catch (e) {}

      playScanBeep(); // 1º BIPE

      const normScanned = normalizeCode(decodedText);
      const resultBox = document.getElementById('scanResult');
      const now = new Date().toLocaleString('pt-BR');

      const item = database.find(i => normalizeCode(i.patrimonio) === normScanned);
      const currentRoomNome = obterNomeSala(currentRoomInput);

      if (item) {
        item.dataLeitura = now;
        item.localEncontrado = currentRoomInput;

        const origRoomNorm = normalizeCode(item.centroGerencial);
        const currRoomNorm = normalizeCode(currentRoomInput);
        const respText = item.resp ? `<b>Responsável:</b> ${item.resp}<br>` : '';

        if (origRoomNorm === currRoomNorm) {
          item.inventario = "Confirmado OK";
          item.situacao = "OK"; // ATUALIZA SITUAÇÃO NO CSV
          playStatusBeep('ok'); // 2º BIPE OK
          resultBox.innerHTML = `
            <div class="result-box status-ok">
              <strong>🟢 CONFIRMADO!</strong> (${item.patrimonio})<br>
              <b>Material:</b> ${item.material}<br>
              ${respText}
              <b>Sala:</b> ${currentRoomNome}
            </div>`;
        } else {
          const origRoomNome = obterNomeSala(item.centroGerencial);
          item.inventario = "Movido de " + item.centroGerencial;
          item.situacao = "OK (Movido)"; // ATUALIZA SITUAÇÃO NO CSV
          playStatusBeep('warning'); // 2º BIPE MOVIDO
          resultBox.innerHTML = `
            <div class="result-box status-warning">
              <strong>🟡 MOVIDO!</strong> (${item.patrimonio})<br>
              <b>Material:</b> ${item.material}<br>
              ${respText}
              <b>Origem:</b> ${origRoomNome}<br>
              ➔ <b>Encontrado em:</b> ${currentRoomNome}
            </div>`;
        }

        updateCounters();
        renderHistory(decodedText, item);
        document.getElementById('btnNextScan').style.display = 'block';

      } else {
        playStatusBeep('danger'); // 2º BIPE ERRO
        
        setTimeout(() => {
          const descUser = prompt(`🔴 Código ${decodedText} NÃO cadastrado!\n\nDigite a descrição do item:`, "Item sem cadastro prévio");
          const descFinal = (descUser && descUser.trim() !== '') ? descUser.trim() : "Item Novo / Não Cadastrado";

          const newItem = {
            patrimonio: decodedText, 
            unidade: "FZEA", 
            centroGerencial: "Não Constava na Base",
            material: descFinal, 
            marca: "", modelo: "", tipo: "", noSerie: "", valor: "", resp: "Não Informado",
            situacao: "OK (Item Novo)", condicao: "Regularizado", 
            inventario: "Item Novo Adicionado",
            retirado: "", 
            localEncontrado: currentRoomInput, 
            dataLeitura: now
          };

          database.push(newItem);

          resultBox.innerHTML = `
            <div class="result-box status-danger">
              <strong>🔴 NOVO ITEM REGISTRADO!</strong><br>
              <b>Código:</b> ${decodedText} | <b>Descrição:</b> ${descFinal}
            </div>`;

          updateCounters();
          renderHistory(decodedText, null);
          document.getElementById('btnNextScan').style.display = 'block';
        }, 100);
      }
    }

    // RETOMAR A LEITURA
    function triggerNextScan() {
      document.getElementById('btnNextScan').style.display = 'none';
      if (html5QrcodeScanner && isScanning) {
        try {
          html5QrcodeScanner.resume();
        } catch (e) {}
        isPaused = false;
      }
    }

    function updateCounters() {
      document.getElementById('totalCount').innerText = database.length;
      const audited = database.filter(i => i.inventario !== 'Pendente' && i.inventario !== '').length;
      document.getElementById('auditedCount').innerText = audited;
    }

    function renderHistory(code, item) {
      const historyList = document.getElementById('historyList');
      const div = document.createElement('div');
      div.className = 'history-item';
      
      const title = item ? item.material : "Novo Item Registrado";
      const status = item ? item.inventario : "Item Novo";
      
      div.innerHTML = `<span><b>${code}</b> - ${title}</span> <span>${status}</span>`;
      historyList.insertBefore(div, historyList.firstChild);
    }

    function exportCSV() {
      if (database.length === 0) {
        alert("Não existem dados para exportar.");
        return;
      }

      let headers = rawHeaders.length > 0 ? [...rawHeaders] : [
        "No. Patrimônio","Unidade","Endereço/Local","Material","Marca","Modelo",
        "Tipo","No.Série","Valor","Resp.","Situação","Condição","Inventário","Retirado"
      ];

      if (!headers.includes("Local_Encontrado")) headers.push("Local_Encontrado");
      if (!headers.includes("Data_Leitura")) headers.push("Data_Leitura");

      let csvContent = "\uFEFF" + headers.map(h => `"${h}"`).join(";") + "\n";

      database.forEach(row => {
        const line = [
          row.patrimonio, row.unidade, row.centroGerencial, row.material, row.marca,
          row.modelo, row.tipo, row.noSerie, row.valor, row.resp, row.situacao,
          row.condicao, row.inventario, row.retirado, row.localEncontrado, row.dataLeitura
        ];
        csvContent += line.map(v => `"${v || ''}"`).join(";") + "\n";
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.setAttribute("href", url);
      link.setAttribute("download", `Patrimonio_Auditado_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
